name: Production forecast and monitoring
on:
  schedule:
    - cron: '17 9,10 * * *'
      timezone: Europe/Berlin
    - cron: '17 18 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      mode:
        description: Forecast before 11:00 Berlin, or monitor only
        type: choice
        options: [forecast, monitor]
        default: forecast
permissions:
  contents: read
concurrency:
  group: production-state
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - name: Restore durable state (bootstrap forecast-data first)
        uses: actions/checkout@v4
        with:
          ref: forecast-data
          path: state
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install controlled dependencies
        working-directory: code
        run: pip install -r requirements.txt
      - name: Ingest, validate, infer and monitor
        id: pipeline
        working-directory: code
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mode="${REQUESTED_MODE:-forecast}"
          if [ "$EVENT_SCHEDULE" = "17 18 * * *" ]; then mode=monitor; fi
          python -m depower.production "$mode" --state ../state --runtime data/runtime
      - name: Persist issued forecasts and monitoring (also on monitoring alert)
        if: always() && steps.pipeline.outcome != 'skipped'
        working-directory: state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for path in market.csv weather.csv forecasts dashboard.json monitoring_history.csv comparison.csv; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Persist forecast and monitoring state [skip ci]"
            # Never force push or merge concurrent changes into an immutable ledger.
            git push origin HEAD:forecast-data
          fi
      - name: Retain diagnostic capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: code/data/runtime
          retention-days: 7
          if-no-files-found: ignore
