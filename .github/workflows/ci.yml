name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: ruff check .
      - run: ruff format --check app.py src/depower/production.py src/depower/monitoring.py src/depower/validation.py tests/test_production.py
      - run: pytest -q
